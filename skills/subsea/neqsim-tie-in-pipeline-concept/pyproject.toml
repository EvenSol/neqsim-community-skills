[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-tie-in-pipeline-concept"
version = "0.1.0"
description = "Screening of an export-pipeline tie-in: candidate landing points, seabed profile, hydraulics, thermal decay and DNV-ST-F101 wall thickness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
