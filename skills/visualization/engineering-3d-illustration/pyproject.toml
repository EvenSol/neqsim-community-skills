[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-engineering-3d-illustration"
version = "0.1.0"
description = "3D illustration of NeqSim designs and results: one backend-neutral scene for vessels, pipelines and layouts, drawn with PyVista, exported as exact solids with CadQuery or OpenSCAD, and rendered with Blender."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
neqsim = ["neqsim"]
viz = ["pyvista>=0.43"]
cad = ["cadquery>=2.4"]
render = ["bpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
