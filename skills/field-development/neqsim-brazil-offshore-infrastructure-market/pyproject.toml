[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-skill-brazil-offshore-infrastructure-market"
version = "0.1.0"
description = "Brazil offshore gas export routes, plants, tariff status, gas spec, oil marketing and host-capacity screening helpers with explicit unknowns."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brazil_offshore_infrastructure_market = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
